# Dev server with hot reload, run with: up --watch
name: weather-development

services:
  app:
    image: weather:development
    build:
      target: development
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      APP_ENV: development
    ports:
      - "${APP_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package-lock.json
