name: 🚀 Weather | CI

on:
  push:
    branches: ["main", "staging", "development"]
  pull_request:
    branches: ["main", "staging", "development"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: 🔍 Verify | Lint, format, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🔏 NPM | Verify registry signatures
        run: npm audit signatures

      - name: 🏷️ Release | Check the version and its changelog entry
        run: node scripts/release-notes.mjs > /dev/null

      - name: 🧹 Oxlint | Lint code
        run: npm run lint -- --format github

      - name: 🎨 Oxfmt | Check formatting
        run: npm run format:check

      - name: 🧠 TypeScript | Check types
        run: npm run typecheck

      - name: 🧪 Vitest | Run tests with coverage
        run: npm run test:coverage

      - name: 📊 Coverage | Publish summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Coverage | Upload report
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  build:
    name: 🛠️ Build | Production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🛠️ Next.js | Build without an API key
        run: npm run build

      - name: 📏 Build | Verify output and report bundle size
        run: node scripts/build-report.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: 🎭 E2E | Browsers, accessibility and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🎭 Playwright | Read version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 🗃️ Playwright | Cache browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: 🎭 Playwright | Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 🧩 Playwright | Install system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 🧪 Playwright | Run against the mock OpenWeatherMap API
        run: npm run test:e2e

      - name: 📤 Playwright | Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: 🐳 Docker | Build and start the runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐳 Docker | Build the staging image without secrets
        run: docker build --file docker/Dockerfile --target runtime --build-arg APP_ENV=staging --tag app:ci .

      - name: 🩺 Docker | Check that the container answers
        run: |
          docker run --detach --name app --env APP_ENV=staging --publish 8080:3000 app:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8080/robots.txt; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1

  dependency-review:
    name: 🛡️ Security | Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛡️ GitHub | Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
